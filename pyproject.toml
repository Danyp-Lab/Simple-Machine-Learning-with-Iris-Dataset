[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "iris-classification-playground"
version = "0.1.0"
description = "Clean scikit-learn machine learning workflow on the Iris dataset with modern PEP standards"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [
    { name = "Danial Pahlavan", email = "danialpahlavan@gmail.com" },
]
dependencies = [
    "scikit-learn>=1.3.0",
    "numpy>=1.24.0",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.6.0",
    "pytest>=8.0.0",
]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B"]
